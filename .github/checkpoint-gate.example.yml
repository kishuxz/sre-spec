name: Checkpoint Gate

on:
  pull_request:

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./packages/github-action
        with:
          spec: packages/examples/src/coding-agent-spec.ts
          traces: packages/examples/traces/coding-agent/*.json
          quiet: "true"

